<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="framework.js" defer></script>
</head>
<body>
    <header class="banner"></header>
    <fr-nav></fr-nav>
    <main>
    <section>
        <fr-ads count="22"></fr-ads>
        <h1>Contacto</h1>
        <form>
            <fieldset>
                <div>
                    <label for="email">e-mail</label>
                    <input type="email" id="email" required placeholder="tu e-mail">
                </div>
                <div>
                    <label for="mesage">mensage</label>
                    <textarea id="mesage" required placeholder="tu mensage"></textarea>
                </div>
                <button type="submit">Enviar</button>
            </fieldset>
        </form>
        <fr-ads count="22"></fr-ads>
    </section>
    </main>
</body>
</html>
